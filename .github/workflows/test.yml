name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Deployment-specific tests (hitting the live stack at asset-explorer.sc2arcade.com)
# are run manually via `BASE_URL=https://... make test-smoke`.

jobs:
  ini:
    name: INI Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-ini

  smoke:
    name: HTTP Smoke (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run API smoke tests (auto-starts docker stack)
        run: make test-smoke
      - name: Collect docker logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down stack
        if: always()
        run: make down

  browser:
    name: Browser (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run browser tests (auto-starts docker stack)
        run: make test-browser
      - name: Collect docker logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down stack
        if: always()
        run: make down
