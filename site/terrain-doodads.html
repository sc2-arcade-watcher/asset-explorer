<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<script type="module">
    import { initPage } from './src/init-page.js';
    import { createLocalItemList } from './src/script.js';

    initPage({
        title: 'Terrain Doodads',
        description: 'Preview of StarCraft II terrain doodad assets in the SC2 All Races Archive.',
        ogTitle: 'SC2 All Races Terrain Doodads Archive',
        ogDescription: 'Browse StarCraft II terrain doodads for modding.',
        searchPlaceholder: 'Search doodads...',
        searchAriaLabel: 'Search doodads',
        intro: 'Preview StarCraft II terrain doodads from the archive.',
        preloaderLabel: 'Loading doodads',
    });

    createLocalItemList({
        list: 'terrain-doodads',
        baseUrl: 'https://dist.sc2arcade.com/star-assets',
        containerSelector: '.icons-grid',
        searchInputSelector: '#icon-search',
        thumbnail: { size: '152x152,fit' },
    }).load();
</script>
</body>
</html>
