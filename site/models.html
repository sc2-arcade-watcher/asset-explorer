<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./src/styles.css">

    <style>
        glb-viewer { min-height: 250px; }

        #model-preview {
            position: fixed;
            top: 50px;
            left: 50px;
            width: 450px;
            height: 300px;
            background: #1c3451;
            border: 2px solid #00d8ff;
            border-radius: 8px;
            box-shadow: 0 0 30px #00d8ffaa;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            user-select: none;
            cursor: grab;
        }

        #glb-viewer.dragging { cursor: grabbing; }
        glb-viewer:fullscreen { border: 0 !important; }
    </style>
    {{- $page := dict "title" "3D Models" -}}
    {{- include "/_partials/seo.html" $page -}}
</head>
<body>
<script type="module">
    import { initPage } from './src/init-page.js';
    import { createItemList, thumbUrl } from './src/script.js';
    import './src/player.js';

    initPage({
        title: '3D Models',
        searchPlaceholder: 'Search model...',
        searchAriaLabel: 'Search icons',
        intro: 'Preview and download StarCraft II 3D model files from the archive.',
        preloaderLabel: 'Loading models',
        wrapMain: true,
        extraBody: ({ main }) => {
            const viewer = document.createElement('glb-viewer');
            viewer.id = 'model-preview';
            viewer.setAttribute('base-url', '');
            viewer.style.display = 'none';
            viewer.style.width = '400px';
            viewer.style.height = '250px';
            viewer.style.border = '1px solid #00d8ff';
            main.appendChild(viewer);
        },
    });

    const viewer = document.getElementById('model-preview');

    // Open clicked .glb links in the in-page preview viewer
    document.body.addEventListener('click', e => {
        const target = e.target.closest('a');
        if (!target || !target.href.endsWith('.glb')) return;
        e.preventDefault();
        const modelFile = target.getAttribute('href');
        if (modelFile && viewer) {
            viewer.addEventListener('load', () => { viewer.style.display = 'block'; });
            viewer.setAttribute('model', modelFile);
        }
    });

    // Drag the preview panel by its frame
    let isDragging = false, offsetX = 0, offsetY = 0;
    viewer.addEventListener('mousedown', (e) => {
        if (e.target !== viewer) return;
        isDragging = true;
        offsetX = e.clientX - viewer.offsetLeft;
        offsetY = e.clientY - viewer.offsetTop;
        viewer.classList.add('dragging');
    });
    document.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        viewer.classList.remove('dragging');
    });
    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        viewer.style.left = (e.clientX - offsetX) + 'px';
        viewer.style.top = (e.clientY - offsetY) + 'px';
    });

    createItemList({
        list: 'models',
        containerSelector: '.icons-grid',
        searchInputSelector: '#icon-search',
        assetBase: 'https://star-assets.github.io/',
        renderItemFn: ({ name, icon }) => {
            const div = document.createElement('div');
            div.className = 'icon-item';
            div.innerHTML = `
                <a href="https://star-assets.github.io/models-glb/${name}.glb" target="_blank">
                    <img src="${thumbUrl(icon.toLowerCase(), '152x152,fit')}" alt="${name}" loading="lazy">
                </a>
                <span class="tooltip">${name}</span>
                <span class="btn copy-btn" data-copy="${name}">⎘</span>
            `;
            return div;
        },
    }).load();
</script>
</body>
</html>
