<!DOCTYPE html>
<html lang="en">
<head>
    {{- include "/_partials/head.html" -}}
    {{- $page := dict "title" "Buttons" -}}
    {{- include "/_partials/seo.html" $page -}}
</head>
<body>
<script type="module">
    import { initPage } from './src/init-page.js';
    import { createItemList } from './src/script.js';

    initPage({
        title: 'Buttons',
        searchPlaceholder: 'Search icons...',
        searchAriaLabel: 'Search icons',
        intro: 'Preview and download StarCraft II icons from the archive.',
        preloaderLabel: 'Loading icons',
    });

    createItemList({
        list: 'buttons',
        containerSelector: '.icons-grid',
        searchInputSelector: '#icon-search',
        thumbnail: { size: '152x152,fit' },
    }).load();
</script>
</body>
</html>
