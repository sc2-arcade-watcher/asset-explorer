<!DOCTYPE html>
<html lang="en">
<head>
    {{- include "/_partials/head.html" -}}
    {{- $page := dict "title" "Overlays" -}}
    {{- include "/_partials/seo.html" $page -}}
</head>
<body>
<script type="module">
    import { initPage } from './src/init-page.js';
    import { createItemList } from './src/script.js';

    initPage({
        title: 'Overlays',
        searchPlaceholder: 'Search overlays...',
        searchAriaLabel: 'Search overlays',
        gridClass: 'overlays-grid',
        intro: 'Preview and download StarCraft II overlays from the archive.',
        preloaderLabel: 'Loading overlays',
    });

    createItemList({
        list: 'overlays',
        containerSelector: '.icons-grid',
        searchInputSelector: '#icon-search',
        thumbnail: { size: '152x152,fit' },
        hrefBuilder: (item) => item.image,
    }).load();
</script>
</body>
</html>
