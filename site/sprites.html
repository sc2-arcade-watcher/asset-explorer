<!DOCTYPE html>
<html lang="en">
<head>
    {{- include "/_partials/head.html" -}}
    {{- $page := dict "title" "Sprites" -}}
    {{- include "/_partials/seo.html" $page -}}
</head>
<body>
<script type="module">
    import { initPage } from './src/init-page.js';
    import { createItemList } from './src/script.js';

    initPage({
        title: 'Sprites',
        searchPlaceholder: 'Search sprites...',
        searchAriaLabel: 'Search sprites',
        gridClass: 'sprites-grid',
        intro: 'Preview and download StarCraft II sprites from the archive.',
        preloaderLabel: 'Loading sprites',
    });

    createItemList({
        list: 'sprites',
        containerSelector: '.icons-grid',
        searchInputSelector: '#icon-search',
        thumbnail: { size: '152x152,fit' },
    }).load();
</script>
</body>
</html>
