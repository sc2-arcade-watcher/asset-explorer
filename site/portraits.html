<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./src/styles.css">
    {{- $page := dict "title" "Portraits" -}}
    {{- include "/_partials/seo.html" $page -}}
</head>
<body>
<script type="module">
    import { initPage } from './src/init-page.js';
    import { createItemList } from './src/script.js';

    initPage({
        title: 'Portraits',
        searchPlaceholder: 'Search portraits...',
        searchAriaLabel: 'Search portraits',
        gridClass: 'portraits-grid',
        intro: 'Preview and download StarCraft II portraits from the archive.',
        preloaderLabel: 'Loading portraits',
    });

    createItemList({
        list: 'portraits',
        containerSelector: '.icons-grid',
        searchInputSelector: '#icon-search',
        thumbnail: { size: '200x300,fit' },
    }).load();
</script>
</body>
</html>
