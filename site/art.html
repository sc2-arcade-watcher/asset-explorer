<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./src/styles.css">
    {{- $page := dict "title" "Art" -}}
    {{- include "/_partials/seo.html" $page -}}
</head>
<body>
<script type="module">
    import { initPage } from './src/init-page.js';
    import { createItemList } from './src/script.js';

    initPage({
        title: 'Art',
        searchPlaceholder: 'Search Art...',
        searchAriaLabel: 'Search Art',
        gridClass: 'art-grid',
        intro: 'Preview and download StarCraft II Art from the archive.',
        preloaderLabel: 'Loading Art',
    });

    createItemList({
        list: 'art',
        containerSelector: '.icons-grid',
        searchInputSelector: '#icon-search',
        assetBase: 'https://star-assets.github.io/',
        thumbnail: { size: '300x200,fit' },
        hrefBuilder: (item) => item.icon,
    }).load();
</script>
</body>
</html>
