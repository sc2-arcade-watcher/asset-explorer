<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<script type="module">
    import { initPage } from './src/init-page.js';
    import { createLocalItemList } from './src/script.js';

    initPage({
        title: 'Terrain Tilesets',
        description: 'Preview of StarCraft II terrain tileset assets in the SC2 All Races Archive.',
        ogTitle: 'SC2 All Races Terrain Tilesets Archive',
        ogDescription: 'Browse StarCraft II terrain tilesets for modding.',
        searchPlaceholder: 'Search tilesets...',
        searchAriaLabel: 'Search tilesets',
        gridClass: 'art-grid',
        intro: 'Preview StarCraft II terrain tilesets from the archive.',
        preloaderLabel: 'Loading tilesets',
    });

    createLocalItemList({
        list: 'terrain-tilesets',
        baseUrl: 'https://dist.sc2arcade.com/star-assets',
        containerSelector: '.icons-grid',
        searchInputSelector: '#icon-search',
        thumbnail: { size: '300x200,fit' },
    }).load();
</script>
</body>
</html>
