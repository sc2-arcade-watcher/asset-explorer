<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SC2Mapster Asset Explorer – Terrain Tilesets</title>

    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"></noscript>
    <link rel="stylesheet" href="./src/styles.css">

    <meta name="description" content="Preview of StarCraft II terrain tileset assets in the SC2 All Races Archive.">
    <meta property="og:title" content="SC2 All Races Terrain Tilesets Archive" />
    <meta property="og:description" content="Browse StarCraft II terrain tilesets for modding." />
    <meta property="og:image" content="img/arc.png" />
</head>
<body>
<header class="small-header">
    <div class="logo-container">
        <a href="./" style="display: flex; align-items: center; text-decoration: none;">
            <img src="img/arc.png" alt="SC2Mapster Asset Explorer Logo" />
            <div><h1>SC2Mapster Asset Explorer</h1>
            <p class="subtitle">Terrain Tilesets</p></div>
        </a>
    </div>
    <input type="search" id="icon-search" placeholder="Search tilesets..." aria-label="Search tilesets" />
    <button class="fullscreen-btn" id="fullscreen-toggle" title="Toggle Fullscreen">⤢</button>
</header>
<article>
    <p>Preview StarCraft II terrain tilesets from the archive. <span id="icons-count"></span></p>

    <div class="icons-grid art-grid" id="icons-grid">
        <div id="preloader" class="grid-preloader" aria-label="Loading tilesets" role="status" aria-live="polite">
            <div class="spinner"></div>
        </div>
    </div>
</article>

<script type="module">
    import { createLocalItemList, thumbUrl } from "./src/script.js"
    document.addEventListener('DOMContentLoaded', () => {
        const list = createLocalItemList({
            list: 'terrain-tilesets',
            baseUrl: 'https://dist.sc2arcade.com/star-assets',
            containerSelector: '.icons-grid',
            searchInputSelector: '#icon-search',
            renderItemFn: ({ file, icon, name }) => {
                const div = document.createElement('div');
                div.className = 'icon-item';
                div.innerHTML = `
                    <a href="${file}" target="_blank">
                        <img src="${thumbUrl(icon, '300x200,fit')}" alt="${name}" loading="lazy">
                    </a>
                    <span class="tooltip">${name}</span>
                    <span class="btn copy-btn" data-copy="${name}">⎘</span>
                `;
                return div;
            },
            onRendered: (list, filtered, all) => {
                document.getElementById('icons-count').textContent = `${filtered.length} / ${all.length}`;
            }
        });
        list.load();
    });
</script>

<footer>
  <p class="attribution">SC2Mapster Asset Explorer — a community resource for StarCraft II mapmakers<br>
  Assets belong to their respective authors. Always credit the original creator.</p>
</footer>

</body>
</html>
