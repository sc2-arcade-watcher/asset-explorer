<!DOCTYPE html>
<html lang="en">
<head>
    {{- include "/_partials/head.html" -}}
    {{- $page := dict "title" "UI Elements" -}}
    {{- include "/_partials/seo.html" $page -}}
</head>
<body>
<script type="module">
    import { initPage } from './src/init-page.js';
    import { createItemList } from './src/script.js';

    initPage({
        title: 'UI Elements',
        searchPlaceholder: 'Search ui...',
        searchAriaLabel: 'Search ui',
        gridClass: 'ui-grid',
        intro: 'Preview and download StarCraft II ui from the archive.',
        preloaderLabel: 'Loading ui',
    });

    createItemList({
        list: 'ui',
        containerSelector: '.icons-grid',
        searchInputSelector: '#icon-search',
        thumbnail: { size: '152x152,fit' },
    }).load();
</script>
</body>
</html>
