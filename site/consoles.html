<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SC2Mapster Asset Explorer – Consoles</title>

    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./src/styles.css">

    <!-- Optional SEO meta -->
    <meta name="description" content="Preview of StarCraft II icon assets in the SC2 All Races Archive.">
    <meta property="og:title" content="SC2 All Races consoles Archive" />
    <meta property="og:description" content="Browse and download StarCraft II consoles for modding." />
    <meta property="og:image" content="img/arc.png" />
</head>
<body>
<header class="small-header">
    <div class="logo-container">
        <a href="./" style="display: flex; align-items: center; text-decoration: none;">
            <img src="img/arc.png" alt="SC2Mapster Asset Explorer Logo" />
            <div><h1>SC2Mapster Asset Explorer</h1>
            <p class="subtitle">Consoles</p></div>
        </a>
    </div>
    <input type="search" id="icon-search" placeholder="Search consoles..." aria-label="Search consoles" />
    <button class="fullscreen-btn" id="fullscreen-toggle" title="Toggle Fullscreen">⤢</button>
</header>
<article>
        
    <p>Preview and download StarCraft II consoles from the archive. <span id="icons-count"></span></p>



    <!--<div class="search-container">-->
    <!--    <input type="text" id="icon-search" placeholder="Search icons by name..." autocomplete="off" />-->
    <!--</div>-->
    <div class="icons-grid art-grid" id="icons-grid">
        <div id="preloader" class="grid-preloader" aria-label="Loading consoles" role="status" aria-live="polite">
            <div class="spinner"></div>
        </div>
        <!-- icons will be injected here -->
    </div>
</article>



<script type="module">
    import {createItemList, thumbUrl} from "./src/script.js"
    document.addEventListener('DOMContentLoaded', () => {

        function parseIniString(iniText) {
  const result = {};
  let currentSection = null;

  const lines = iniText.split(/\r?\n/);
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith(';') || trimmed.startsWith('#')) continue;

    const sectionMatch = trimmed.match(/^\[(.+?)\]$/);
    if (sectionMatch) {
      currentSection = sectionMatch[1];
      result[currentSection] = [];
    } else if (currentSection) {
      result[currentSection].push(trimmed);
    }
  }

  return result;
}



        const iconList = createItemList({
            list: 'consoles',
            containerSelector: '.icons-grid',
            searchInputSelector: '#icon-search',
            renderItemFn: ({file, icon, name}) => {
                const div = document.createElement('div');
                div.className = 'icon-item';
                const filePath = `https://star-assets.github.io/${file}`;
                const filePathPNG = `https://star-assets.github.io/${icon}`;
                div.innerHTML = `
                    <a href="${filePath}" target="_blank">
                        <img src="${thumbUrl(filePathPNG, '300x200,fit')}" alt="${name}" loading="lazy">
                    </a>
                    <span class="tooltip">${name}</span>
                    <span class="btn copy-btn" data-copy=${name}>⎘</span>
                `;
                return div;
            },
            onRendered: (list) => {
                document.getElementById("icons-count").textContent = list.length + " icons found"
                console.log('Icons rendered and filtered');
            }
        });
        iconList.load();
    });
</script>
