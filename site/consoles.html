<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<script type="module">
    import { initPage } from './src/init-page.js';
    import { createItemList } from './src/script.js';

    initPage({
        title: 'Consoles',
        description: 'Preview of StarCraft II icon assets in the SC2 All Races Archive.',
        ogTitle: 'SC2 All Races consoles Archive',
        ogDescription: 'Browse and download StarCraft II consoles for modding.',
        searchPlaceholder: 'Search consoles...',
        searchAriaLabel: 'Search consoles',
        gridClass: 'art-grid',
        intro: 'Preview and download StarCraft II consoles from the archive.',
        preloaderLabel: 'Loading consoles',
    });

    createItemList({
        list: 'consoles',
        containerSelector: '.icons-grid',
        searchInputSelector: '#icon-search',
        assetBase: 'https://star-assets.github.io/',
        thumbnail: { size: '300x200,fit' },
    }).load();
</script>
</body>
</html>
