<!DOCTYPE html>
<html lang="en">
<head>
    {{- include "/_partials/head.html" -}}
    {{- $page := dict "title" "Wireframes" -}}
    {{- include "/_partials/seo.html" $page -}}
</head>
<body>
<script type="module">
    import { initPage } from './src/init-page.js';
    import { createItemList } from './src/script.js';

    initPage({
        title: 'Wireframes',
        searchPlaceholder: 'Search wireframes...',
        searchAriaLabel: 'Search wireframes',
        gridClass: 'wireframes-grid',
        intro: 'Preview and download StarCraft II wireframes from the archive.',
        preloaderLabel: 'Loading wireframes',
    });

    createItemList({
        list: 'wireframes',
        containerSelector: '.icons-grid',
        searchInputSelector: '#icon-search',
        thumbnail: { size: '152x152,fit' },
    }).load();
</script>
</body>
</html>
