<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SC2Mapster Asset Explorer – Wireframes</title>

    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./src/styles.css">

    <!-- Optional SEO meta -->
    <meta name="description" content="Preview of StarCraft II icon assets in the SC2 All Races Archive.">
    <meta property="og:title" content="SC2 All Races wireframes Archive" />
    <meta property="og:description" content="Browse and download StarCraft II wireframes for modding." />
    <meta property="og:image" content="img/arc.png" />
</head>
<body>
<header class="small-header">
    <div class="logo-container">
        <a href="./" style="display: flex; align-items: center; text-decoration: none;">
            <img src="img/arc.png" alt="SC2Mapster Asset Explorer Logo" />
            <div><h1>SC2Mapster Asset Explorer</h1>
            <p class="subtitle">Wireframes</p></div>
        </a>
    </div>
    <input type="search" id="icon-search" placeholder="Search wireframes..." aria-label="Search wireframes" />
    <button class="fullscreen-btn" id="fullscreen-toggle" title="Toggle Fullscreen">⤢</button>
</header>
<article>
        
    <p>Preview and download StarCraft II wireframes from the archive. <span id="icons-count"></span></p>



    <!--<div class="search-container">-->
    <!--    <input type="text" id="icon-search" placeholder="Search icons by name..." autocomplete="off" />-->
    <!--</div>-->
    <div class="icons-grid wireframes-grid" id="icons-grid">
        <div id="preloader" class="grid-preloader" aria-label="Loading wireframes" role="status" aria-live="polite">
            <div class="spinner"></div>
        </div>
        <!-- icons will be injected here -->
    </div>
</article>



<script type="module">
    import { createItemList } from "./src/script.js";
    document.addEventListener('DOMContentLoaded', () => {
        createItemList({
            list: 'wireframes',
            containerSelector: '.icons-grid',
            searchInputSelector: '#icon-search',
            assetBase: 'https://star-assets.github.io/',
            thumbnail: { size: '152x152,fit' },
        }).load();
    });
</script>


<footer>
  <a href="https://github.com/sc2-arcade-watcher/asset-explorer" aria-label="GitHub repository" target="_blank" rel="noopener noreferrer">

  </a>
</footer>

</body>
</html>
